---
version: 0.1

runtime:
  language: dotnet
  version: "8.0"

globalTimeout: 150
testSuiteTimeout: 150
testSuiteStep: 150

runson: ${matrix.os}

autosplit: true
retryOnFailure: true

maxRetries: 1
concurrency: 2
parallelism: 1

cacheKey: '{{ checksum "packages.txt" }}'

matrix:
  os: [mac, win, linux]
  project:
    - "NUnitHyperTestDemo/NUnitHyperTestDemo.csproj"
  testmethods:
    - "ToDoTest"
    - "LoginTest"

pre:
  - dotnet --version
  - dotnet restore NUnitHyperTestDemo.sln
  - dotnet build NUnitHyperTestDemo.sln

mergeArtifacts: true

uploadArtefacts:
  - name: ExecutionSnapshots
    path:
      - NUnitHyperTestDemo/Reports/**

report: true

partialReports:
  type: json
  location: NUnitHyperTestDemo/
  frameworkName: extent

testDiscovery:
  type: raw
  mode: remote
  command: grep 'Category' NUnitHyperTestDemo -ir --include=\*.cs --exclude=DriverFactory.cs --exclude=HyperTestDemo.AssemblyInfo.cs | awk '{print $2}' | grep -o '".*"' | tr -d '"' | sort -u

testRunnerCommand: dotnet test NUnitHyperTestDemo.sln --filter "TestCategory=$test"

jobLabel:
  - selenium-Nunit
  - hybrid