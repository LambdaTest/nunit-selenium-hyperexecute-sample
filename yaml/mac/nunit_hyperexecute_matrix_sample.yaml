---
version: 0.1

runtime:
  language: dotnet
  version: "8.0"

globalTimeout: 150
testSuiteTimeout: 150
testSuiteStep: 150

runson: mac

retryOnFailure: true
maxRetries: 1
concurrency: 2

matrix:
  project:
    - "NUnitHyperTestDemo/NUnitHyperTestDemo.csproj"
  testmethods:
    - "ToDoTest"
    - "LoginTest"

pre:
  - dotnet --version
  - dotnet restore NUnitHyperTestDemo.sln
  - dotnet build NUnitHyperTestDemo.sln

cacheKey: '{{ checksum "packages.txt" }}'

mergeArtifacts: true

uploadArtefacts:
  - name: ExecutionSnapshots
    path:
      - NUnitHyperTestDemo/Reports/**

report: true

partialReports:
  type: json
  location: NUnitHyperTestDemo/
  frameworkName: extent

testSuites:
  - dotnet test $project --filter "(Category=$testmethods)"

jobLabel:
  - selenium-Nunit
  - mac
  - matrix