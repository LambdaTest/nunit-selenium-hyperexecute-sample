---
version: "0.2"
runson: mac

autosplit: true
concurrency: 2

pre:
  - dotnet restore
  - dotnet build -c Release --no-restore

# Framework-based remote test discovery: HyperExecute's .NET runner discovers
# NUnit tests from the built assembly on the worker — no grep-based discovery
# command or testRunnerCommand needed.
framework:
  name: dotnet/nunit
  discoveryMode: remote   # dotnet/* runners are remote-discovery only
  discoveryType: method   # method (default) | class
  # single-project repo: the runner locates the csproj and built assembly itself;
  # multi-project repos pass flags: [--project, <path-to-csproj>]

retryOnFailure: true
maxRetries: 1

jobLabel: [selenium-nunit, mac, remote-discovery, v0.2]

runtime:
  language: dotnet
  version: "8.0"
