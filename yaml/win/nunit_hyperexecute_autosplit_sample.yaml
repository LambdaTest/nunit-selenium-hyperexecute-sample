---
version: 0.1

runtime:
  language: dotnet
  version: "8.0"

runson: win

autosplit: true
concurrency: 2

env:
  NUGET_PACKAGES: 'C:\nuget_global_cache'
  NUGET_HTTP_CACHE_PATH: 'C:\nuget_http_cache'
  NUGET_PLUGINS_CACHE_PATH: 'C:\nuget_plugins_cache'

pre:
  - dotnet --version
  - dotnet restore NUnitHyperTestDemo.sln
  - dotnet list NUnitHyperTestDemo/NUnitHyperTestDemo.csproj package > packages.txt
  - nuget locals all -clear
  - dotnet build NUnitHyperTestDemo.sln -c Release

testDiscovery:
  type: raw
  mode: remote
  command: powershell -ExecutionPolicy Bypass -File scripts/discover-tests.ps1

testRunnerCommand: dotnet test NUnitHyperTestDemo.sln --filter "TestCategory=$test"

retryOnFailure: true
maxRetries: 1

jobLabel:
  - selenium-Nunit
  - win
  - autosplit