---
version: 0.1

runson: win

autosplit: true
retryOnFailure: true
maxRetries: 1
concurrency: 2

runtime:
  language: dotnet
  version: "8.0"

env:
  NUGET_PACKAGES: 'C:\nuget_global_cache'
  NUGET_HTTP_CACHE_PATH: 'C:\nuget_http_cache'
  NUGET_PLUGINS_CACHE_PATH: 'C:\nuget_plugins_cache'

pre:
  - dotnet --version
  - dotnet restore NUnitHyperTestDemo.sln
  - dotnet list NUnitHyperTestDemo/NUnitHyperTestDemo.csproj package > packages.txt
  - nuget locals all -clear
  - dotnet build NUnitHyperTestDemo.sln -c Release

mergeArtifacts: true

testDiscovery:
  type: raw
  mode: remote
  command: |
    echo ToDoTest
    echo SeleniumPlayGround

testRunnerCommand: dotnet test NUnitHyperTestDemo.sln --filter "Category=$test"

jobLabel:
  - selenium-Nunit
  - win
  - autosplit-simple